name: Admission test fixtures
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixtures:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: surya-8143/paved-road-platform
          ref: 7f9fb01d8cf6b81014e72ad50e87c40d73fa831c
          persist-credentials: false
      - name: Install checksum-pinned signer
        run: |
          python3 scripts/install_tools.py cosign
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish inert negative-test images
        run: |
          mkdir -p evidence
          for scenario in unsigned wrong-signer; do
            tag="$IMAGE:admission-$scenario-$GITHUB_RUN_ID"
            printf 'FROM scratch\nLABEL purpose="admission-test-only"\nLABEL scenario="%s"\n' "$scenario" | docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" -t "$tag" -
            docker push "$tag"
            digest=$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')
            ref="$IMAGE@$digest"
            if [ "$scenario" = wrong-signer ]; then
              cosign sign --yes "$ref"
              cosign verify --certificate-identity "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/admission-fixtures.yml@refs/heads/main" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$ref" > evidence/wrong-signer-verification.json
            fi
            jq -n --arg scenario "$scenario" --arg image "$ref" '{scenario:$scenario,image:$image}' > "evidence/$scenario.json"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admission-fixtures
          path: evidence/
          retention-days: 14
          if-no-files-found: error
