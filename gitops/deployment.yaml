apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  labels:
    app: paved-road-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paved-road-demo
  template:
    metadata:
      labels:
        app: paved-road-demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/surya-8143/paved-road-demo-service@sha256:8fc580a852f4f88a4546982d2cddb4c0d0b4feda2f6b679b2da4b0c4b389ed8c
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
